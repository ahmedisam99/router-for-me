name: cli-proxy-api # fixed, so the project name doesn't follow the directory name
services:
  cli-proxy-api:
    image: cli-proxy-api:local
    build:
      context: ../CLIProxyAPI
      args: # stamped by up.sh
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    restart: "no" # quoted: a bare no is boolean false under YAML 1.1
    ports: # OAuth callbacks (codex 1455, claude 54545) are unpublished: add one for a login, then remove it
      - "127.0.0.1:8317:8317" # cx alias + direct
      - "127.0.1.1:80:8317" # http://predator-eos (hostname resolves to 127.0.1.1 via /etc/hosts; loopback, not LAN-reachable)
    volumes:
      - ./data:/root/.cli-proxy-api
      - ./config.yaml:/CLIProxyAPI/config.yaml # pinned by inode: edits that replace the file (sed -i, git checkout) need a restart
      - ./plugins:/CLIProxyAPI/plugins # plugin binaries (.so); plugin data goes to ./data/plugins
      - ./static:/CLIProxyAPI/static:ro # our management.html from up.sh, read per request; ro so upstream's panel download can't replace it
